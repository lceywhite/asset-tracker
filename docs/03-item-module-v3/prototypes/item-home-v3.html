        trunk: { title: "后备箱", avatar: "▰", parent: "小灰 · SUV", childLabel: "容器", collection: "¥4,820", itemCount: 11, trail: ["我的车库", "小灰 · SUV", "后备箱"], layouts: [{ name: "默认布局", children: [["露营箱", "camp", "📦", "8 件"]] }], items: [["车载吸尘器", "🌀", "¥399"], ["折叠椅", "🪑", "¥680"]] }
      };
      const fallback = (key) => ({ title: key, avatar: "📦", parent: "上一级空间", childLabel: "容器", collection: "¥0", itemCount: 0, trail: [key], layouts: [], items: [] });
      let current = "house";
      let layoutIndex = 0;
      let dragged = null;
      const show = (name) => root.querySelectorAll("[data-page]").forEach((page) => { page.hidden = page.dataset.page !== name; });
      const renderItems = (items) => {
        const host = root.querySelector("[data-items]"); host.innerHTML = "";
        items.forEach(([name, icon, value]) => { const button = document.createElement("button"); button.type = "button"; button.className = "item-row"; button.innerHTML = `<span class="item-thumb">${icon}</span><span><strong>${name}</strong><span class="path text-small">直属于当前空间</span></span><span class="item-value"><strong>${value}</strong><span class="text-small">估值</span></span>`; host.appendChild(button); });
        if (!items.length) host.innerHTML = '<p class="no-layout">当前空间没有直属物品</p>';
      };
      const renderLayout = () => {
        const data = spaces[current] || fallback(current); const block = root.querySelector("[data-layout-block]");
        if (!data.layouts.length) { block.hidden = true; return; }
        block.hidden = false; layoutIndex = Math.min(layoutIndex, data.layouts.length - 1); const layout = data.layouts[layoutIndex];
        root.querySelector("[data-layout-name]").textContent = layout.name; root.querySelector("[data-next-layout]").hidden = data.layouts.length < 2;
        const canvas = root.querySelector("[data-layout-canvas]"); canvas.innerHTML = "";
        layout.children.forEach(([name, key, icon, count], index) => { const button = document.createElement("button"); button.type = "button"; button.className = "layout-node"; button.draggable = canvas.classList.contains("layout-editing"); button.dataset.index = index; button.innerHTML = `<span>${icon}<span class="drag-label text-small">拖动排版</span></span><span><strong>${name}</strong><span class="text-small">${count}</span></span>`; button.addEventListener("click", () => { if (!canvas.classList.contains("layout-editing")) openSpace(key); }); button.addEventListener("dragstart", () => { dragged = index; }); button.addEventListener("dragover", (event) => event.preventDefault()); button.addEventListener("drop", () => { if (dragged === null || dragged === index) return; const moved = layout.children.splice(dragged, 1)[0]; layout.children.splice(index, 0, moved); dragged = null; renderLayout(); root.querySelector("[data-layout-canvas]").classList.add("layout-editing"); }); canvas.appendChild(button); });
      };
      const openSpace = (key) => { current = key; layoutIndex = 0; const data = spaces[key] || fallback(key); root.querySelector("[data-parent]").textContent = data.parent; root.querySelector("[data-avatar]").textContent = data.avatar; root.querySelector("[data-title]").textContent = data.title; const childCount = data.layouts.flatMap((layout) => layout.children).length; root.querySelector("[data-child-count]").textContent = childCount; root.querySelector("[data-child-count]").parentElement.lastChild.textContent = ` 个${data.childLabel}`; root.querySelector("[data-item-count]").textContent = data.itemCount; root.querySelector("[data-collection]").textContent = data.collection; root.querySelector("[data-add-child]").textContent = `＋ 添加${data.childLabel}`; root.querySelector("[data-trail]").innerHTML = data.trail.map((part, index) => index === data.trail.length - 1 ? `<span>${part}</span>` : `<button type="button">${part}</button><span>›</span>`).join(""); root.querySelector("[data-layout-canvas]").classList.remove("layout-editing"); root.querySelector("[data-add-layout]").hidden = true; root.querySelector("[data-edit-layout]").textContent = "编辑"; renderLayout(); renderItems(data.items); show("detail"); };
      root.querySelectorAll("[data-show]").forEach((button) => button.addEventListener("click", () => show(button.dataset.show)));
      root.querySelectorAll("[data-open]").forEach((button) => button.addEventListener("click", () => openSpace(button.dataset.open)));
      root.querySelectorAll("[data-section-title]").forEach((title) => title.addEventListener("dblclick", () => { root.querySelector("[data-section-name]").value = title.dataset.sectionTitle; show("manage"); }));
      root.querySelector("[data-next-layout]").addEventListener("click", () => { const layouts = (spaces[current] || fallback(current)).layouts; layoutIndex = (layoutIndex + 1) % layouts.length; renderLayout(); });
      root.querySelector("[data-edit-layout]").addEventListener("click", (event) => { const canvas = root.querySelector("[data-layout-canvas]"); const editing = canvas.classList.toggle("layout-editing"); root.querySelector("[data-add-layout]").hidden = !editing; event.currentTarget.textContent = editing ? "完成" : "编辑"; renderLayout(); if (editing) root.querySelector("[data-layout-canvas]").classList.add("layout-editing"); });
      root.querySelector("[data-add-layout]").addEventListener("click", () => { const data = spaces[current] || fallback(current); data.layouts.push({ name: `布局 ${data.layouts.length + 1}`, children: [] }); layoutIndex = data.layouts.length - 1; renderLayout(); root.querySelector("[data-layout-canvas]").classList.add("layout-editing"); });
      root.querySelectorAll("[data-edit-section]").forEach((button) => button.addEventListener("click", () => { const name = button.dataset.editSection; root.querySelector("[data-section-name]").value = name; root.querySelector("[data-section-description]").value = button.dataset.description; const removable = name === "公司仓库"; const deleteButton = root.querySelector("[data-delete-section]"); deleteButton.disabled = !removable; deleteButton.textContent = removable ? "删除分区" : "默认分区不可删除"; }));
    })();
  </script>
